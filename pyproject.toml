[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norivy-kiosk"
version = "1.0.0"
description = "Norivy — asistente de voz con avatar VRM para la pantalla inteligente de una tienda de motos y bicicletas (OpenAI Realtime GA + API de la tienda)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Instalar con: pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Core sólido: pyflakes + pycodestyle + imports + pyupgrade + bugbear + simplify + complejidad.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# sounddevice no trae stubs; el resto del wiring sí es type-safe.
[[tool.mypy.overrides]]
module = ["sounddevice.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pruebas unitarias rápidas y aisladas",
    "integration: pruebas que cruzan componentes",
]
